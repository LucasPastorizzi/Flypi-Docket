# Roda a suíte de banco em todo push e PR.
#
# Sem Docker e sem service container, e a razão é paridade: o Postgres é
# instalado no próprio runner, do mesmo jeito que o README manda instalar na
# máquina de quem desenvolve. Com `services: postgres`, o servidor fica num
# container e o pgTAP seria compilado no filesystem do runner — a extensão
# nunca apareceria para o servidor, e `create extension pgtap` falharia por um
# motivo que não tem nada a ver com o schema.
#
# A suíte não precisa do stack Supabase porque o que ela consome dele — os três
# roles e auth.uid() — está emulado em supabase/tests/helpers, com a
# implementação real de auth.uid() e não com um atalho de teste.
name: banco

on:
  push:
  pull_request:

jobs:
  rls:
    # Versão fixa, não `ubuntu-latest`: a major do Postgres disponível muda com
    # a do Ubuntu, e uma troca silenciosa de base é a última coisa que se quer
    # embaixo de uma suíte cujo objeto é comportamento de RLS.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # Ubuntu 24.04 só traz até o postgresql-17 client, e não traz o
      # server-dev-17 de que o pgTAP precisa para compilar. O repositório do
      # próprio projeto Postgres (PGDG) traz — e é ele que permite fixar a
      # major igual à que o Supabase serve, que é o ponto: divergir de major
      # esconderia diferença de comportamento de RLS entre versões.
      - name: Instalar Postgres 17 do repositório PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-17 postgresql-client-17 postgresql-server-dev-17 make git

      # pgTAP não está empacotado no Ubuntu e é compilado do fonte — são um
      # Makefile e arquivos SQL, sem dependência além do pg_config.
      - name: Compilar e instalar o pgTAP
        run: |
          git clone --depth 1 --branch v1.3.4 https://github.com/theory/pgtap.git /tmp/pgtap
          make -C /tmp/pgtap
          sudo make -C /tmp/pgtap install

      # A imagem do runner já traz um PostgreSQL ocupando a 5432, então o
      # cluster 17 recém-instalado nasce noutra porta — e o pacote do Ubuntu já
      # o inicia no postinst, de modo que um `start` explícito falha com
      # "cluster is already running". Por isso a porta é descoberta em vez de
      # suposta, e o start é tolerado: quem decide se deu certo são o `test -n`
      # e o `pg_isready`, que verificam o resultado em vez da saída do comando.
      - name: Subir o cluster e descobrir a porta
        run: |
          sudo pg_ctlcluster 17 main start || true
          pg_lsclusters
          PORTA="$(pg_lsclusters -h | awk '$1=="17" && $2=="main" {print $3}')"
          test -n "$PORTA"
          sudo -u postgres psql -p "$PORTA" \
            -c "alter user postgres password 'postgres'"
          pg_isready -h localhost -p "$PORTA"
          echo "PGPORT=$PORTA" >> "$GITHUB_ENV"

      - name: Rodar a suíte
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/db-test.sh
